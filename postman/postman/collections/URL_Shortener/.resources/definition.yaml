$kind: collection
description: |-
  ## URL Shortener API

  This collection covers the complete workflow for interacting with the **URL Shortener API** — a service that allows authenticated users to create, manage, and delete shortened URLs.

  ### Authentication

  Before accessing any URL management endpoints, users must register and log in:

  - **CreateUserByEmail** — Register a new user account using an email address.
      
  - **LoginUser** — Authenticate an existing user and obtain an access token.
      

  ### URL Management

  Once authenticated, users can perform the following operations on shortened URLs:

  - **shortenURL** — Submit a long URL to receive a shortened version.
      
  - **getAllURLs** — Retrieve a list of all shortened URLs associated with the authenticated user.
      
  - **deleteURL** — Delete a specific shortened URL by its unique code.
      

  ### Environment

  This collection uses the `{{BASE_URL}}` environment variable to define the base API endpoint. Make sure the **URL_Shortener** environment is selected before running any requests.
variables:
  BASE_URL: "http://localhost:8000"
  USER_FIRST_NAME: "John"
  USER_LAST_NAME: "Doe"
  USER_EMAIL: "john@example.com"
  USER_PASSWORD: "password123"
  TOKEN: ""
  URL_ID: ""
